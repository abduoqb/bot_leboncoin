name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installer les dependances
        run: pip install -r requirements-dev.txt
      - name: Config d'exemple (prompts.py est gitignore)
        run: cp prompts.example.py prompts.py
      - name: Tests
        run: python -m pytest tests -q
      - name: Selftests sans navigateur
        run: |
          python -u tools/selftest_scan.py
          python -u tools/selftest_context.py
          python -u tools/selftest_pending.py
          python -u tools/selftest_list_scroll.py
          python -u tools/selftest_instance.py
      - name: Ruff
        run: |
          pip install ruff
          python -m ruff check .
